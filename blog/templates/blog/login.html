{% extends "blog/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Log in
    </button>
</form>

</form>

<p class="mt-3">
    <a href="{% url 'password_reset' %}">
        Forgot password?
    </a>
</p>


{% endblock %}
